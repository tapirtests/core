name: TG notify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  notify:
    runs-on: ubuntu-latest
    steps:
    - name: telegram_notify_success
      run: |
        curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_API_TOKEN/sendMessage" \
        --data-urlencode "chat_id=$TELEGRAM_CHAT_ID" \
        --data-urlencode "text=✅ Успешная сборка
  
        Репозиторий: $github_repository
        Ветка: $github.ref_name
        Коммит: $GITHUB_SHA
        👨‍💻 Автор: Автор
        ⏰ Время сборки: ${BUILDING_TIME_TEXT}
  
        🔗 Ссылка на пайплайн:
        $CI_PIPELINE_URL" \
              --data-urlencode "parse_mode=" \
              --data-urlencode "disable_web_page_preview=true"

    - name: telegram_notify_failure
      run: go test -v ./...
