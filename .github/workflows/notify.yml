name: TG notify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  notify:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_TOKEN: ${{ secrets.TELEGRAM_API_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
    - name: debug
      run: |
        echo "Длина токена: ${#TELEGRAM_API_TOKEN}"
        echo "Длина chat_id: ${#TELEGRAM_CHAT_ID}"
        curl -s "https://api.telegram.org/bot${TELEGRAM_API_TOKEN}/getMe"
    - name: telegram_notify_success
      run: |
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_API_TOKEN}/sendMessage" \
        --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=✅ Успешная сборка
  
        Репозиторий: $GITHUB_REPOSITORY
        Ветка: $GITHUB_REF_NAME
        Коммит: $GITHUB_SHA
        👨‍💻 Автор: $GITHUB_ACTOR
        ⏰ Время сборки: 1
  
        🔗 Ссылка на пайплайн:
        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --data-urlencode "parse_mode=" \
              --data-urlencode "disable_web_page_preview=true"

    - name: telegram_notify_failure
      run: |
        curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_API_TOKEN}/sendMessage" \
        --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
        --data-urlencode "text=❌ При сборке произошла ошибка
  
        Репозиторий: $GITHUB_REPOSITORY
        Ветка: $GITHUB_REF_NAME
        Коммит: $GITHUB_SHA
        👨‍💻 Автор: $GITHUB_ACTOR
        ⏰ Время сборки: 1
  
        🔗 Ссылка на пайплайн:
        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --data-urlencode "parse_mode=" \
              --data-urlencode "disable_web_page_preview=true"
      if: ${{ always() && contains(needs.*.result, 'failure') }}
