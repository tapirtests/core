name: TG notify

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  notify:
    runs-on: ubuntu-latest
    steps:
    - name: telegram_notify_success
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ vars.TELEGRAM_API_TOKEN }}/sendMessage" \
        --data-urlencode "chat_id=${{ vars.TELEGRAM_CHAT_ID }}" \
        --data-urlencode "text=✅ Успешная сборка
  
        Репозиторий: $github_repository
        Ветка: $github.ref_name
        Коммит: $github_sha
        👨‍💻 Автор: $github_actor
        ⏰ Время сборки: ${BUILDING_TIME_TEXT}
  
        🔗 Ссылка на пайплайн:
        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/core/actions/runs/$github_run_id" \
              --data-urlencode "parse_mode=" \
              --data-urlencode "disable_web_page_preview=true"

    - name: telegram_notify_failure
      run: |
        curl -s -X POST "https://api.telegram.org/bot${{ vars.TELEGRAM_API_TOKEN }}/sendMessage" \
        --data-urlencode "chat_id=${{ vars.TELEGRAM_CHAT_ID }}" \
        --data-urlencode "text=❌ При сборке произошла ошибка
  
        Репозиторий: $github_repository
        Ветка: $github.ref_name
        Коммит: $github_sha
        👨‍💻 Автор: $github_actor
        ⏰ Время сборки: ${BUILDING_TIME_TEXT}
  
        🔗 Ссылка на пайплайн:
        $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/core/actions/runs/$github_run_id" \
              --data-urlencode "parse_mode=" \
              --data-urlencode "disable_web_page_preview=true"
